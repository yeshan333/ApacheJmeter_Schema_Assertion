name: Release JAR

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload the JAR to (for example v1.2.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  upload-jar:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"

      - name: Build plugin JAR
        run: mvn clean package -DskipTests

      - name: Verify packaged JAR
        run: stat ./examples/ApacheJmeter_Schema_Assertion-*.jar

      - name: Upload JAR to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ./examples/ApacheJmeter_Schema_Assertion-*.jar
          fail_on_unmatched_files: true
          overwrite_files: true
